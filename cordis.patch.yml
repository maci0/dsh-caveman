# Row to paste into ~/.dsh/profiles/<profile>/cordis.patch.yml.
# That file is live-watched; dsh.profile.bundles is frozen at boot.
# `name` stays a bare package specifier — the browser half is served by the
# client module system, which resolves the Loader entry's package, reads its
# `dsh.client` manifest, and serves `exports["./client"]`.
# Do not also list this package in dsh.profile.bundles: insert does not
# dedupe ids, two rows would register the plugin twice.
- insert:
    - id: caveman
      name: 'dsh-caveman'
      config:
        defaultMode: full
